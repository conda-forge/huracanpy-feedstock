{% set name = "huracanpy" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/huracanpy-{{ version }}.tar.gz
  sha256: d115218b7ce40d01c8e4d80cdb3a72a822746b8ca40c411d87da04cb5ff3abb5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - xarray
    - cftime
    - parse
    - shapely
    - pandas
    - geopandas >=0.14.4
    - matplotlib-base
    - seaborn
    - netcdf4
    - haversine
    - cartopy
    - matplotlib-venn <1
    - metpy
    - tqdm
    - pyarrow
    - pyproj

test:
  imports:
    - huracanpy
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/Huracan-project/huracanpy
  summary: A python package for working with various forms of feature tracking data
  license: MIT
  license_file: LICENSE
  doc_url: https://huracanpy.readthedocs.io

extra:
  recipe-maintainers:
    - leosaffin
